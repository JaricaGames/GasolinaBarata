plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'

}

//DATOS DE FIRMA DESDE local.properties (GITIGNORADO: LAS CONTRASEÑAS NO ENTRAN EN EL REPO)
def keystoreProperties = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { keystoreProperties.load(it) }
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.jarica.preciogasolina"
        minSdk 27
        targetSdk 36
        versionCode 12
        versionName "3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties['RELEASE_STORE_FILE']) {
                storeFile file(keystoreProperties['RELEASE_STORE_FILE'])
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            //SOLO FIRMA SI local.properties TIENE LOS DATOS; SI NO, EL BUNDLE SALE SIN FIRMAR
            if (keystoreProperties['RELEASE_STORE_FILE']) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // IDs reales de AdMob (solo release: las builds de desarrollo no deben servir anuncios reales)
            buildConfigField "String", "AD_UNIT_BUSCAR", '"ca-app-pub-4979320410432560/7752668839"'
            buildConfigField "String", "AD_UNIT_LISTA", '"ca-app-pub-4979320410432560/2352636871"'
            buildConfigField "String", "AD_UNIT_MAPA", '"ca-app-pub-4979320410432560/1231126890"'
            buildConfigField "String", "AD_UNIT_FAVORITOS", '"ca-app-pub-4979320410432560/8638843620"'
        }
        debug {
            // ID de banner de prueba oficial de Google: impresiones/clics de desarrollo no cuentan
            buildConfigField "String", "AD_UNIT_BUSCAR", '"ca-app-pub-3940256099942544/6300978111"'
            buildConfigField "String", "AD_UNIT_LISTA", '"ca-app-pub-3940256099942544/6300978111"'
            buildConfigField "String", "AD_UNIT_MAPA", '"ca-app-pub-3940256099942544/6300978111"'
            buildConfigField "String", "AD_UNIT_FAVORITOS", '"ca-app-pub-3940256099942544/6300978111"'
        }
    }
    compileOptions {
        sourceCompatibility "17"
        targetCompatibility "17"
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    namespace 'com.jarica.preciogasolina'
}

dependencies {

    // Compose (versiones gestionadas por el BOM)
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    // Los iconos ya no van incluidos en 'material' ni en el BOM; version propia (la ultima publicada)
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.runtime:runtime-livedata'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.activity:activity-ktx:1.12.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    // Lifecycle / ViewModel / LiveData
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //retrofit
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    //Dagger
    implementation 'com.google.dagger:hilt-android:2.57.2'
    ksp 'com.google.dagger:hilt-android-compiler:2.57.2'
    // Dagger 2.57 aun lee metadata de Kotlin 2.3 como maximo; se sobreescribe su
    // kotlin-metadata-jvm (desagrupado desde 2.57) para que entienda Kotlin 2.4
    ksp 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0'
    annotationProcessor 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0'

    //Navegacion
    implementation 'androidx.navigation:navigation-compose:2.9.6'

    //Maps
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.maps.android:maps-compose:8.3.0'

    //Room
    implementation 'androidx.room:room-runtime:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'

    //Ads
    implementation 'com.google.android.gms:play-services-ads:24.4.0'

    //DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.7'

}
